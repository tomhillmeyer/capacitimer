<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitimer</title>
  <link rel="stylesheet" href="/shared-styles.css" />
  <style>
    body {
      font-family: 'Jura', system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-transform: uppercase;
    }

    .launcher-container {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo img {
      max-width: 300px;
      height: auto;
    }

    h1 {
      font-size: 1.5rem;
      color: #C58F3A;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
    }

    p {
      color: #aaa;
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.5;
      text-transform: none;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-button {
      border: none;
      border-radius: 8px;
      padding: 1.5rem;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: 'Jura', system-ui, -apple-system, sans-serif;
      text-transform: uppercase;
    }

    .option-button:hover {
      transform: translateY(-2px);
    }

    .option-button:active {
      transform: translateY(0);
    }

    /* Filled button style (Control) */
    .option-button-filled {
      background: #BF4E34;
      color: white;
    }

    .option-button-filled:hover {
      background: #DC883B;
    }

    /* Outlined button style (Display) */
    .option-button-outlined {
      background: transparent;
      border: 2px solid #BF4E34;
      color: #BF4E34;
    }

    .option-button-outlined:hover {
      background: rgba(191, 78, 52, 0.1);
      border-color: #DC883B;
      color: #DC883B;
    }

    .footer {
      margin-top: 2rem;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="launcher-container">
    <div class="logo">
      <img src="/capacitimer-wordmark.png" alt="Capacitimer">
    </div>
    <div class="options">
      <button class="option-button option-button-filled" onclick="launchControl()">
        Control
      </button>

      <button class="option-button option-button-outlined" onclick="launchDisplay()">
        Timer Display Only
      </button>
    </div>
  </div>

  <script>
    function launchDisplay() {
      fetch('/api/launcher/display', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            console.log('Launched display mode');
          }
        })
        .catch(error => console.error('Failed to launch display:', error));
    }

    function launchControl() {
      fetch('/api/launcher/control', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            console.log('Launched control mode');
          }
        })
        .catch(error => console.error('Failed to launch control:', error));
    }
  </script>
</body>

</html>
