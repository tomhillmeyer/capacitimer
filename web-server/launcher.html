<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitimer</title>
  <link rel="stylesheet" href="/shared-styles.css" />
  <style>
    body {
      font-family: 'Jura', system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-transform: uppercase;
    }

    .launcher-container {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo img {
      max-width: 300px;
      height: auto;
    }

    h1 {
      font-size: 1.5rem;
      color: #C58F3A;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
    }

    p {
      color: #aaa;
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.5;
      text-transform: none;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-button {
      background: #BF4E34;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      text-align: center;
      font-family: 'Jura', system-ui, -apple-system, sans-serif;
      text-transform: uppercase;
    }

    .option-button:hover {
      opacity: 0.8;
    }

    .option-button:active {
      transform: translateY(0);
    }

    .option-title {
      font-size: 1.2rem;
    }

    .option-description {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: normal;
      color: rgba(255, 255, 255, 0.8);
    }

    .footer {
      margin-top: 2rem;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="launcher-container">
    <div class="logo">
      <img src="/capacitimer-wordmark.png" alt="Capacitimer">
    </div>
    <div class="options">
      <button class="option-button" onclick="launchControl()">
        <div class="option-title">Control</div>
        <div class="option-description">With timer display minimized</div>
      </button>

      <button class="option-button" onclick="launchDisplay()">
        <div class="option-title">Timer Display Only</div>
      </button>

    </div>
  </div>

  <script>
    function launchDisplay() {
      fetch('/api/launcher/display', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            console.log('Launched display mode');
          }
        })
        .catch(error => console.error('Failed to launch display:', error));
    }

    function launchControl() {
      fetch('/api/launcher/control', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            console.log('Launched control mode');
          }
        })
        .catch(error => console.error('Failed to launch control:', error));
    }
  </script>
</body>

</html>
