<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitimer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        .wordmark {
            height: 80px;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 3rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        a {
            display: block;
            padding: 1.5rem 2rem;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        a:hover {
            transform: translateY(-2px);
        }

        a:active {
            transform: translateY(0);
        }

        .link-control {
            background: #BF4E34;
        }

        .link-control:hover {
            background: #d4584b;
            box-shadow: 0 4px 12px rgba(191, 78, 52, 0.4);
        }

        .link-display {
            background: transparent;
            border: 2px solid #BF4E34;
            color: #BF4E34;
        }

        .link-display:hover {
            background: rgba(191, 78, 52, 0.1);
            box-shadow: 0 4px 12px rgba(191, 78, 52, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/capacitimer-wordmark.png" alt="Capacitimer" class="wordmark">

        <div class="links">
            <a href="/control" class="link-control">Control Page</a>
            <a href="/display" class="link-display">Display Page</a>
        </div>
    </div>
</body>

</html>
